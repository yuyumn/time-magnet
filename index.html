<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Magnet</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px 20px;
      background: #f7f3ee;
      color: #2f2a25;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      line-height: 1.7;
      color: #6f655c;
    }

    .cards {
      display: grid;
      gap: 16px;
      margin-top: 28px;
    }

    a.card {
      display: block;
      padding: 20px;
      border-radius: 18px;
      background: #fffaf4;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .card strong {
      display: block;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .card span {
      color: #6f655c;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Time Magnet</h1>
    <p>15分単位で予定と実績を配置する学習時間管理アプリです。</p>

    <div class="cards">
      <a class="card" href="./simple/">
        <strong>Time Magnet Simple</strong>
        <span>普段使い用の簡易版</span>
      </a>

      <a class="card" href="./analysis/">
        <strong>Time Magnet Analysis Lab</strong>
        <span>週間分析・予実比較などを試す実験版</span>
      </a>
    </div>
  </main>
</body>
</html>
